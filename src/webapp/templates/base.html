<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}DACA Ops{% endblock %}</title>
<style>
  /* ---- Rho design tokens (Brand Guidelines V3.2 + LLM Style Guide) ----
     Palette: white + black + Caribbean teal as the third hero color, teal used
     sparingly and intentionally. Sentence case, left-aligned, generous white
     space, soft shadows, 8px radii, 200ms transitions. */
  :root {
    --moon-0:#FFFFFF; --moon-50:#F6F8F8; --moon-100:#F2F4F4;
    --abyss-900:#000000; --abyss-800:#0E1111; --abyss-700:#3A3C3B;
    --abyss-500:#667070; --abyss-400:#878D8C;
    --carib-100:#CDFBF2; --carib-200:#9CF7E6; --carib-500:#07EBC0; --carib-800:#035E4D;
    --mist-100:#D9E4E5; --mist-300:#81A5A9;

    --bg:var(--moon-50); --surface:var(--moon-0); --surface-2:var(--moon-100);
    --ink:#151716; --muted:var(--abyss-500); --line:var(--mist-100);
    --accent:var(--carib-500); --accent-ink:#0E1111;
    --ring:rgba(7,235,192,.45);
    --ok-bg:var(--carib-100); --ok-ink:var(--carib-800);
    --warn-bg:#FBEFD3; --warn-ink:#7A5B18;
    --flag-bg:#FBE3E3; --flag-ink:#9B2C2C;
    --shadow:0 1px 2px rgba(16,17,17,.04), 0 4px 16px rgba(16,17,17,.06);
    --radius:12px; --radius-sm:8px;
    --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px; --sp-8:48px;
    --font: 'Basier Circle', Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:var(--abyss-800); --surface:#151817; --surface-2:#1b1f1e;
      --ink:var(--moon-100); --muted:#AFBCBC; --line:#2a2e2d;
      --accent:var(--carib-500); --accent-ink:#0E1111;
      --ok-bg:#06342b; --ok-ink:var(--carib-200);
      --warn-bg:#3a2f12; --warn-ink:#F3D18B;
      --flag-bg:#3a1a1a; --flag-ink:#F6B4B4;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
    }
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--font); font-size:15px; line-height:1.5;
    -webkit-font-smoothing:antialiased; }
  a { color:inherit; }
  h1 { font-size:26px; font-weight:650; letter-spacing:-.01em; line-height:1.1; margin:0; }
  h2 { font-size:16px; font-weight:600; letter-spacing:-.005em; margin:0 0 var(--sp-3); }
  h3 { font-size:14px; font-weight:600; margin:0 0 var(--sp-3); }
  .muted { color:var(--muted); }
  .small { font-size:13px; }

  /* header */
  header { background:var(--surface); border-bottom:1px solid var(--line);
    padding:0 var(--sp-5); height:60px; display:flex; align-items:center; gap:var(--sp-6);
    position:sticky; top:0; z-index:10; }
  .brand { font-weight:700; font-size:16px; letter-spacing:-.01em; text-decoration:none;
    display:flex; align-items:center; gap:var(--sp-2); }
  .brand .dot { width:10px; height:10px; border-radius:50%; background:var(--accent);
    box-shadow:0 0 0 3px var(--ok-bg); }
  nav { display:flex; gap:var(--sp-5); }
  nav a { color:var(--muted); text-decoration:none; font-weight:500; font-size:14px;
    padding:4px 0; border-bottom:2px solid transparent; transition:color .2s, border-color .2s; }
  nav a:hover { color:var(--ink); }
  nav a.active { color:var(--ink); border-bottom-color:var(--accent); }

  main { padding:var(--sp-6) var(--sp-5); max-width:1360px; margin:0 auto; }

  /* buttons — Abyss fill, teal hover, 8px radius, 200ms */
  .btn { display:inline-flex; align-items:center; gap:6px; background:var(--ink);
    color:var(--moon-0); border:1px solid var(--ink); padding:9px 16px;
    border-radius:var(--radius-sm); font:inherit; font-weight:600; font-size:14px;
    cursor:pointer; text-decoration:none; transition:background .2s, color .2s, border-color .2s, transform .05s; }
  .btn:hover { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .btn:active { transform:translateY(1px); }
  .btn.secondary { background:transparent; color:var(--ink); border-color:var(--line); }
  .btn.secondary:hover { border-color:var(--ink); background:var(--surface-2); color:var(--ink); }
  :focus-visible { outline:none; box-shadow:0 0 0 3px var(--ring); border-radius:var(--radius-sm); }

  /* cards */
  .card { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:var(--sp-5); box-shadow:var(--shadow); }
  .stack > * + * { margin-top:var(--sp-4); }

  /* pills — teal only for the "good/active" state, used sparingly */
  .pill { display:inline-flex; align-items:center; gap:4px; padding:2px 9px; border-radius:999px;
    font-size:12px; font-weight:600; background:var(--surface-2); color:var(--muted);
    border:1px solid var(--line); white-space:nowrap; }
  .pill.ok { background:var(--ok-bg); color:var(--ok-ink); border-color:transparent; }
  .pill.warn { background:var(--warn-bg); color:var(--warn-ink); border-color:transparent; }
  .pill.flag { background:var(--flag-bg); color:var(--flag-ink); border-color:transparent; }

  /* forms */
  label { display:block; font-weight:600; font-size:13px; margin:var(--sp-4) 0 var(--sp-1); }
  input, select, textarea { width:100%; padding:10px 12px; border:1px solid var(--line);
    border-radius:var(--radius-sm); background:var(--surface); color:var(--ink);
    font:inherit; font-size:14px; transition:border-color .2s, box-shadow .2s; }
  input:focus, select:focus, textarea:focus { outline:none; border-color:var(--accent);
    box-shadow:0 0 0 3px var(--ring); }
  ::placeholder { color:var(--abyss-400); }

  /* tables */
  table { width:100%; border-collapse:collapse; }
  th { text-align:left; font-size:12px; font-weight:600; color:var(--muted);
    padding:8px 10px; border-bottom:1px solid var(--line); }
  td { padding:10px; border-bottom:1px solid var(--line); vertical-align:top; font-size:14px; }
  tr:last-child td { border-bottom:0; }

  /* empty state */
  .empty { text-align:center; color:var(--muted); padding:var(--sp-8) var(--sp-4); }

  /* KPI tiles */
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:var(--sp-4); }
  .kpi { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:var(--sp-4) var(--sp-5); box-shadow:var(--shadow); }
  .kpi .n { font-size:30px; font-weight:680; letter-spacing:-.02em; line-height:1.1; }
  .kpi .l { color:var(--muted); font-size:13px; font-weight:500; }
  .kpi.alert { border-color:var(--flag-ink); }
  .kpi.alert .n { color:var(--flag-ink); }

  /* pipeline funnel — horizontal stage flow with counts */
  .funnel { display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; }
  .funnel-step { flex:1 1 0; min-width:104px; text-decoration:none; color:inherit;
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-sm);
    padding:10px 12px; position:relative; transition:border-color .2s, transform .05s; }
  .funnel-step:hover { border-color:var(--accent); }
  .funnel-step .fc { font-size:22px; font-weight:680; letter-spacing:-.02em; }
  .funnel-step .fl { color:var(--muted); font-size:11.5px; line-height:1.25; margin-top:2px; }
  .funnel-step.empty0 { opacity:.5; }
  .funnel-step.term { background:var(--ok-bg); border-color:transparent; }
  .funnel-step.term .fc { color:var(--ok-ink); }

  /* stage stepper — per-case progress tracker */
  .stepper { display:flex; gap:4px; overflow-x:auto; padding-bottom:4px; }
  .step { flex:1 1 0; min-width:92px; text-align:center; padding:8px 6px 10px;
    border-radius:var(--radius-sm); border:1px solid var(--line); background:var(--surface);
    position:relative; }
  .step .sl { font-size:11px; line-height:1.2; color:var(--muted); }
  .step .sd { width:12px; height:12px; border-radius:50%; margin:0 auto 6px;
    background:var(--surface-2); border:2px solid var(--line); }
  .step.done .sd { background:var(--accent); border-color:var(--accent); }
  .step.done .sl { color:var(--ink); }
  .step.current { border-color:var(--accent); box-shadow:0 0 0 3px var(--ring); }
  .step.current .sd { background:var(--accent); border-color:var(--accent);
    box-shadow:0 0 0 3px var(--ok-bg); }
  .step.current .sl { color:var(--ink); font-weight:650; }
  .step.off { opacity:.55; }

  /* work-queue card */
  .wq-col { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:var(--sp-4); }
  .wq-card { display:block; text-decoration:none; color:inherit; padding:11px 0;
    border-top:1px solid var(--line); }
  .wq-card:first-of-type { border-top:0; }
  .wq-title { font-weight:600; text-decoration:none; color:inherit; }
  .wq-title:hover { color:var(--accent); }
  a.ext { color:var(--muted); text-decoration:none; border-bottom:1px dashed var(--line); }
  a.ext:hover { color:var(--accent); border-bottom-color:var(--accent); }
  details.book > summary { cursor:pointer; font-weight:600; list-style:none; padding:var(--sp-2) 0; }
  details.book > summary::-webkit-details-marker { display:none; }
  details.book > summary::before { content:"▸ "; color:var(--muted); }
  details.book[open] > summary::before { content:"▾ "; }

  /* action queue */
  .action { display:flex; gap:var(--sp-3); align-items:flex-start; padding:12px var(--sp-5);
    border-top:1px solid var(--line); }
  .action:first-child { border-top:0; }
  .action .sev { width:8px; height:8px; border-radius:50%; margin-top:6px; flex:0 0 auto;
    background:var(--mist-300); }
  .action.high .sev { background:#D64545; }
  .action.med .sev { background:#E0A100; }
  .action.low .sev { background:var(--mist-300); }
  .action .who { min-width:0; }
  .action .title { font-weight:600; }
  .action .do { color:var(--muted); font-size:13px; margin-top:1px; }
  .action .meta { margin-left:auto; text-align:right; white-space:nowrap; padding-left:var(--sp-4); }

  /* kanban */
  .kanban { display:flex; gap:var(--sp-4); overflow-x:auto; padding-bottom:6px; align-items:flex-start; }
  .kcol { flex:0 0 288px; background:var(--surface-2); border:1px solid var(--line);
    border-radius:var(--radius); padding:10px; }
  .kcol > h3 { display:flex; align-items:center; justify-content:space-between; margin:2px 4px 10px;
    font-size:13px; }
  .kcard { display:block; background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius-sm); padding:11px 12px; margin-bottom:8px; text-decoration:none;
    color:inherit; box-shadow:var(--shadow); border-left:3px solid var(--line); transition:border-color .15s; }
  .kcard:hover { border-color:var(--mist-300); }
  .kcard.age-red { border-left-color:#D64545; }
  .kcard.age-amber { border-left-color:#E0A100; }
  .kcard.age-ok { border-left-color:var(--accent); }
  .kcard .kt { font-weight:600; line-height:1.25; }
  .kcard .km { color:var(--muted); font-size:12px; margin-top:3px; }
  .age-pill { font-size:11px; font-weight:600; padding:1px 7px; border-radius:999px; }
  .age-pill.age-red { background:#FBE3E3; color:#9B2C2C; }
  .age-pill.age-amber { background:#FBEFD3; color:#7A5B18; }
  .age-pill.age-ok { background:var(--surface-2); color:var(--muted); }

  /* side-by-side scrollable columns */
  .split { display:grid; grid-template-columns:1fr 1fr; gap:var(--sp-4); align-items:start; }
  @media (max-width:900px){ .split { grid-template-columns:1fr; } }
  .panel { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); display:flex; flex-direction:column; max-height:74vh; }
  .panel > .phead { padding:var(--sp-4) var(--sp-5) var(--sp-3); border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; }
  .panel > .pbody { overflow-y:auto; padding:4px 0; }
  .panel > .pbody.pad { padding:var(--sp-4) var(--sp-5); }

  /* end-to-end progress card */
  .pcard { display:block; text-decoration:none; color:inherit; padding:12px var(--sp-5);
    border-top:1px solid var(--line); }
  .pcard:first-child { border-top:0; }
  .pcard:hover { background:var(--surface-2); }
  .track { display:flex; gap:3px; margin:9px 0 7px; }
  .track .seg { height:6px; flex:1; border-radius:3px; background:var(--line); }
  .track .seg.done { background:var(--accent); }
  .track .seg.current { background:var(--accent); box-shadow:0 0 0 2px var(--ok-bg); }
  .pnext { font-size:12.5px; color:var(--muted); }
  .pnext b { color:var(--ink); font-weight:600; }

  /* client comms thread */
  .thread { display:flex; flex-direction:column; gap:8px; max-height:420px; overflow-y:auto;
    padding-right:4px; }
  .bubble { border:1px solid var(--line); border-radius:var(--radius-sm); padding:9px 12px;
    background:var(--surface); }
  .bubble.internal { background:var(--warn-bg); border-color:transparent; }
  .bubble .bh { font-size:12px; color:var(--muted); margin-bottom:4px; display:flex;
    justify-content:space-between; gap:8px; align-items:center; }
  .bubble .bb { white-space:pre-wrap; font-size:13.5px; line-height:1.5; }
  .tag-internal { font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.05em;
    color:var(--warn-ink); }
</style>
</head>
<body>
<header>
  <a class="brand" href="/"><span class="dot"></span> DACA Ops</a>
  <nav>
    <a href="/" class="{% block nav_pipeline %}{% endblock %}">Dashboard</a>
    <a href="/reports/webster" class="{% block nav_reports %}{% endblock %}">Webster report</a>
    <a href="/sync" class="{% block nav_sync %}{% endblock %}">Sync</a>
  </nav>
</header>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
