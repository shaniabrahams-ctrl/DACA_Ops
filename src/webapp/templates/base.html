<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}DACA Ops{% endblock %}</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --ink: #1a1d24; --muted: #6b7280;
    --line: #e5e7eb; --accent: #2f6feb; --accent-ink:#fff;
    --warn-bg:#fef3c7; --warn-ink:#92400e; --flag-bg:#fee2e2; --flag-ink:#991b1b;
    --ok-bg:#dcfce7; --ok-ink:#166534;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1115; --card:#171a21; --ink:#e6e8ec; --muted:#9aa3af;
      --line:#272b33; --accent:#4b82f0; --warn-bg:#3a2f0b; --warn-ink:#fcd34d;
      --flag-bg:#3a1414; --flag-ink:#fca5a5; --ok-bg:#0f2e1a; --ok-ink:#86efac; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  header { background:var(--card); border-bottom:1px solid var(--line);
    padding:12px 20px; display:flex; align-items:center; gap:20px; position:sticky; top:0; z-index:5; }
  header .brand { font-weight:700; font-size:16px; }
  header a { color:var(--ink); text-decoration:none; }
  header nav a { color:var(--muted); margin-right:16px; font-weight:500; }
  header nav a:hover { color:var(--accent); }
  .btn { display:inline-block; background:var(--accent); color:var(--accent-ink);
    padding:8px 14px; border-radius:7px; border:0; font-weight:600; cursor:pointer;
    text-decoration:none; font-size:13px; }
  .btn.secondary { background:transparent; color:var(--accent); border:1px solid var(--accent); }
  main { padding:20px; max-width:1400px; margin:0 auto; }
  .muted { color:var(--muted); }
  .pill { display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px;
    font-weight:600; background:var(--line); color:var(--muted); }
  .pill.warn { background:var(--warn-bg); color:var(--warn-ink); }
  .pill.flag { background:var(--flag-bg); color:var(--flag-ink); }
  .pill.ok { background:var(--ok-bg); color:var(--ok-ink); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; }
  input, select, textarea { width:100%; padding:9px 10px; border:1px solid var(--line);
    border-radius:7px; background:var(--bg); color:var(--ink); font:inherit; }
  label { display:block; font-weight:600; margin:12px 0 4px; font-size:13px; }
  table { width:100%; border-collapse:collapse; }
  td, th { text-align:left; padding:7px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.03em; }
</style>
</head>
<body>
<header>
  <a class="brand" href="/">🏦 DACA Ops</a>
  <nav>
    <a href="/">Pipeline</a>
    <a href="/intake">+ New DACA Request</a>
  </nav>
</header>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
