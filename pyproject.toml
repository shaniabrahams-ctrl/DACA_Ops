[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "daca-ops"
version = "0.1.0"
description = "DACA Operations Platform — Rho x Webster Bank"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    # Validation & settings
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    # Task queue
    "celery[redis]>=5.4.0",
    "redis>=5.2.0",
    # AI
    "anthropic>=0.40.0",
    # Google APIs
    "google-api-python-client>=2.155.0",
    "google-auth>=2.36.0",
    "google-auth-oauthlib>=1.2.1",
    "google-auth-httplib2>=0.2.0",
    # Document generation
    "python-docx>=1.1.2",
    "jinja2>=3.1.4",
    # PDF generation
    "weasyprint>=62.3",
    "openpyxl>=3.1.5",
    # HTTP
    "httpx>=0.28.0",
    "tenacity>=9.0.0",
    # Utilities
    "cryptography>=44.0.0",
    "python-dateutil>=2.9.0",
    "pytz>=2024.2",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "factory-boy>=3.3.1",
    "faker>=33.0.0",
    "black>=24.10.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "httpx>=0.28.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
